name: CI

on:
  push:
    branches: [ main, breathing-mvp ]
  pull_request:
    branches: [ main, breathing-mvp ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python>=4.8.0
        pip install mediapipe>=0.10.0
        pip install numpy>=1.24.0
        pip install scipy>=1.10.0
        pip install streamlit>=1.28.0
        pip install websockets>=11.0
        pip install pytest>=7.4.0
        pip install pytest-cov>=4.1.0

    - name: Install project
      run: |
        pip install -e .

    - name: Run tests
      run: |
        pytest tests/ -v --cov=breath_monitor --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black>=23.0.0
        pip install flake8>=6.0.0

    - name: Run black
      run: |
        black --check breath_monitor/ tests/ main.py

    - name: Run flake8
      run: |
        flake8 breath_monitor/ tests/ --max-line-length=88 --extend-ignore=E203
